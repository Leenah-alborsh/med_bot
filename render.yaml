services:
  - type: web
    name: med-bot-api
    runtime: node
    repo: https://github.com/Leenah-alborsh/med_bot
    plan: free
    region: frankfurt
    branch: master
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health
    buildCommand: npm install --global pnpm@9.15.4 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @medical/shared build && pnpm --filter @medical/database build && pnpm --filter @medical/bot-worker build && pnpm --filter @medical/api build
    startCommand: pnpm --filter @medical/api start
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEON_DIRECT_URL
        sync: false
      - key: API_PREFIX
        value: api
      - key: API_CORS_ORIGIN
        value: https://med-bot-admin.vercel.app
      - key: ADMIN_SESSION_TTL_SECONDS
        value: 43200
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: LOG_LEVEL
        value: info
      - key: TELEGRAM_WEBHOOK_ENABLED
        value: 'true'
      - key: MEDICAL_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_API_ROOT
        fromService:
          type: pserv
          name: med-bot-telegram-api
          property: hostport
      - key: TELEGRAM_FILE_CHANNEL_ID
        sync: false
      - key: ADMIN_UPLOAD_TOKEN_SECRET
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: '2000000000'
      - key: TELEGRAM_WEBHOOK_URL
        value: https://med-bot-api-ughi.onrender.com/api/v1/telegram/webhook
  - type: pserv
    name: med-bot-telegram-api
    runtime: docker
    repo: https://github.com/Leenah-alborsh/med_bot
    plan: 1c-2g
    region: frankfurt
    branch: master
    autoDeployTrigger: commit
    dockerfilePath: ./infra/telegram-bot-api/Dockerfile
    dockerContext: ./infra/telegram-bot-api
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
    disk:
      name: telegram-bot-api-data
      mountPath: /var/lib/telegram-bot-api
      sizeGB: 5
    buildFilter:
      paths:
        - infra/telegram-bot-api/**
        - render.yaml
