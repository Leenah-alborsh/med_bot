services:
  telegram-bot-api:
    profiles: ['telegram-local']
    build:
      context: ./docker/telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    ports:
      - '127.0.0.1:8081:8081'
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api

  postgres:
    image: postgres:16-bookworm
    container_name: medical-telegram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medical
      POSTGRES_PASSWORD: medical_dev_password
      POSTGRES_DB: medical_telegram
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medical -d medical_telegram']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  telegram_bot_api_data:
  postgres_data:
